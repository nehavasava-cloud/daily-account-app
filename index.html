<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <title>Daily Account Assistant - MVP</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #8b5cf6;
            --primary-light: #a78bfa;
            --primary-lighter: #ddd6fe;
            --accent: #06b6d4;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg: #ffffff;
            --bg-secondary: #f9fafb;
            --bg-tertiary: #f3f4f6;
            --border: #e5e7eb;
            --border-light: #f0f1f3;
            --text-primary: #111827;
            --text-secondary: #6b7280;
            --text-muted: #9ca3af;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.07);
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            overflow: hidden;
        }

        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            padding: 16px 20px;
            background: var(--bg);
            border-bottom: 1px solid var(--border-light);
            box-shadow: var(--shadow-sm);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .header-text h1 {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .header-text p {
            font-size: 11px;
            color: var(--text-muted);
        }

        main {
            flex: 1;
            overflow-y: auto;
            padding: 0 16px 80px 16px;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .balance-card {
            background: linear-gradient(135deg, var(--primary-lighter) 0%, #eff6ff 100%);
            border: 1px solid #e0d9f8;
            border-radius: 14px;
            padding: 16px;
            margin: 16px 0;
            box-shadow: var(--shadow-sm);
        }

        .balance-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .balance-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary);
            line-height: 1;
        }

        .balance-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 12px;
        }

        .balance-item {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid var(--border-light);
            border-radius: 10px;
            padding: 10px;
        }

        .balance-item-label {
            font-size: 10px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .balance-item-value {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .balance-item-value.credit {
            color: var(--success);
        }

        .balance-item-value.debit {
            color: var(--danger);
        }

        .alert {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--danger);
            border-radius: 10px;
            padding: 12px;
            margin: 12px 0;
            color: var(--danger);
            font-size: 12px;
            display: flex;
            gap: 8px;
            align-items: flex-start;
        }

        .alert.success {
            background: rgba(16, 185, 129, 0.1);
            border-color: var(--success);
            color: var(--success);
        }

        .alert.warning {
            background: rgba(245, 158, 11, 0.1);
            border-color: var(--warning);
            color: var(--warning);
        }

        .alert.info {
            background: rgba(59, 130, 246, 0.1);
            border-color: #3b82f6;
            color: #3b82f6;
        }

        .upload-section {
            background: linear-gradient(135deg, var(--primary-lighter) 0%, #eff6ff 100%);
            border: 2px dashed #e0d9f8;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin: 16px 0;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .upload-section:hover {
            border-color: var(--primary);
        }

        .upload-section.loading {
            pointer-events: none;
            opacity: 0.6;
        }

        .upload-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .upload-text {
            font-size: 13px;
            color: var(--text-primary);
            font-weight: 600;
            margin-bottom: 4px;
        }

        .upload-subtext {
            font-size: 11px;
            color: var(--text-muted);
        }

        #fileInput {
            display: none;
        }

        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 16px 0;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 12px;
            transition: all 0.2s ease;
        }

        .btn-primary:active {
            transform: scale(0.95);
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 16px 0;
        }

        .stat-card {
            background: var(--bg);
            border: 1px solid var(--border-light);
            border-radius: 10px;
            padding: 12px;
            text-align: center;
        }

        .stat-label {
            font-size: 10px;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 600;
        }

        .stat-value {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
        }

        .day-entry {
            background: var(--bg);
            border: 1px solid var(--border-light);
            border-radius: 11px;
            padding: 12px;
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .day-info {
            flex: 1;
        }

        .day-date {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .day-summary {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .day-status {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
        }

        .day-status.verified {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
        }

        .day-status.mismatch {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
        }

        .day-actions {
            display: flex;
            gap: 6px;
        }

        .btn-action {
            width: 32px;
            height: 32px;
            border: 1px solid var(--border-light);
            background: var(--bg-secondary);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .btn-action:active {
            background: var(--bg-tertiary);
        }

        .btn-action.danger {
            color: var(--danger);
            border-color: var(--danger);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            z-index: 1000;
        }

        .modal.active {
            display: flex;
            align-items: flex-end;
        }

        .modal-content {
            background: var(--bg);
            width: 100%;
            border-radius: 20px 20px 0 0;
            padding: 20px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-btn {
            width: 32px;
            height: 32px;
            border: 1px solid var(--border-light);
            background: var(--bg-secondary);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-label {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 6px;
            display: block;
        }

        .form-input, .form-select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-light);
            border-radius: 8px;
            font-size: 13px;
            font-family: inherit;
            color: var(--text-primary);
        }

        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 16px;
        }

        nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            background: var(--bg);
            border-top: 1px solid var(--border-light);
            padding: 8px 0;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            color: var(--text-muted);
            font-size: 10px;
            cursor: pointer;
            border: none;
            background: none;
            font-weight: 600;
        }

        .nav-item.active {
            color: var(--primary);
        }

        .nav-icon {
            font-size: 18px;
            margin-bottom: 3px;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div id="app">
        <header>
            <div class="header-left">
                <div class="user-avatar">📮</div>
                <div class="header-text">
                    <h1>Daily Account</h1>
                    <p id="headerDate">Today</p>
                </div>
            </div>
        </header>

        <main>
            <!-- HOME -->
            <div id="homePage" class="page active">
                <div class="balance-card">
                    <div class="balance-label">Today's Balance</div>
                    <div class="balance-value" id="balanceValue">₹ 0.00</div>
                    <div class="balance-row">
                        <div class="balance-item">
                            <div class="balance-item-label">Opening</div>
                            <div class="balance-item-value" id="openingVal">₹ 0</div>
                        </div>
                        <div class="balance-item">
                            <div class="balance-item-label">Closing</div>
                            <div class="balance-item-value" id="closingVal">₹ 0</div>
                        </div>
                    </div>
                    <div class="balance-row" style="margin-top: 10px;">
                        <div class="balance-item">
                            <div class="balance-item-label">Credits</div>
                            <div class="balance-item-value credit" id="creditsVal">₹ 0</div>
                        </div>
                        <div class="balance-item">
                            <div class="balance-item-label">Debits</div>
                            <div class="balance-item-value debit" id="debitsVal">₹ 0</div>
                        </div>
                    </div>
                    <div id="statusDiv" style="margin-top: 10px;"></div>
                </div>

                <div class="action-grid">
                    <button class="btn-primary" onclick="openAddTransaction()">
                        <div>➕</div>
                        <div>Add Entry</div>
                    </button>
                    <button class="btn-primary" onclick="showNotification('📊 Reports coming soon')">
                        <div>📊</div>
                        <div>Reports</div>
                    </button>
                </div>
            </div>

            <!-- DASHBOARD -->
            <div id="dashboardPage" class="page">
                <div style="margin-top: 16px;">
                    <h2 style="font-size: 16px; margin-bottom: 12px; font-weight: 700;">📊 This Month</h2>
                    
                    <div class="dashboard-grid">
                        <div class="stat-card">
                            <div class="stat-label">Total Credits</div>
                            <div class="stat-value" id="monthlyCredits">₹ 0</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Total Debits</div>
                            <div class="stat-value" id="monthlyDebits">₹ 0</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Current Balance</div>
                            <div class="stat-value" id="currentBalance">₹ 0</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Days Uploaded</div>
                            <div class="stat-value" id="daysUploaded">0</div>
                        </div>
                    </div>

                    <h2 style="font-size: 16px; margin: 20px 0 12px 0; font-weight: 700;">📅 Daily Activity</h2>
                    <div id="dailyActivityList"></div>
                </div>
            </div>

            <!-- LEDGER -->
            <div id="ledgerPage" class="page">
                <div style="margin-top: 16px;">
                    <h2 style="font-size: 16px; margin-bottom: 12px; font-weight: 700;">📋 Ledger</h2>
                    <div id="ledgerList"></div>
                </div>
            </div>
        </main>

        <nav>
            <button class="nav-item active" onclick="showPage('home')">
                <div class="nav-icon">🏠</div>
                <div>Home</div>
            </button>
            <button class="nav-item" onclick="showPage('dashboard')">
                <div class="nav-icon">📊</div>
                <div>Dashboard</div>
            </button>
            <button class="nav-item" onclick="showPage('ledger')">
                <div class="nav-icon">📋</div>
                <div>Ledger</div>
            </button>
            <button class="nav-item" onclick="showNotification('ℹ️ MVP v1.0')">
                <div class="nav-icon">ℹ️</div>
                <div>Info</div>
            </button>
        </nav>
    </div>

    <!-- ADD TRANSACTION MODAL -->
    <div class="modal" id="transactionModal">
        <div class="modal-content">
            <div class="modal-header">
                <span>➕ Add Transaction</span>
                <button class="close-btn" onclick="closeModal('transactionModal')">✕</button>
            </div>
            <form onsubmit="submitTransaction(event)">
                <div class="form-group">
                    <label class="form-label">Description</label>
                    <input type="text" id="txnName" class="form-input" placeholder="e.g., COD Payment" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Type</label>
                    <select id="txnType" class="form-select" onchange="updateCategories()" required>
                        <option value="">Select type...</option>
                        <option value="credit">📥 Credit (Incoming)</option>
                        <option value="debit">📤 Debit (Outgoing)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Amount (₹)</label>
                    <input type="number" id="txnAmount" class="form-input" placeholder="0" step="0.01" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Category</label>
                    <select id="txnCategory" class="form-select" required>
                        <option value="">Select category...</option>
                    </select>
                </div>
                <button type="submit" class="btn-submit">Add Transaction</button>
            </form>
        </div>
    </div>

    <script>
        // ===== CONFIG =====
        const API_ENDPOINT = 'https://script.google.com/macros/s/AKfycbwPo7Qt_JGKAijXBNyIjKYHEvYCCSNOtiIKjDvp13e0H6P781iNBxm5IK66mLa0ju0Z/exec';
        let currentDate = new Date().toISOString().split('T')[0];

        // ===== INIT =====
        document.addEventListener('DOMContentLoaded', function() {
            setHeaderDate();
            loadAllData();
        });

        function setHeaderDate() {
            const now = new Date();
            const options = { weekday: 'short', month: 'short', day: 'numeric' };
            document.getElementById('headerDate').textContent = now.toLocaleDateString('en-US', options);
            currentDate = now.toISOString().split('T')[0];
        }

        function formatCurrency(amount) {
            if (!amount || isNaN(amount)) amount = 0;
            return '₹ ' + parseFloat(amount).toLocaleString('en-IN', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }

        // ===== LOAD ALL DATA =====
        function loadAllData() {
            loadSummary();
            loadMonthlyData();
            loadLedger();
        }

        // ===== LOAD TODAY SUMMARY =====
        async function loadSummary() {
            try {
                const url = `${API_ENDPOINT}?action=getSummary`;
                console.log('Fetching summary from:', url);
                
                const response = await fetch(url);
                const data = await response.json();
                
                console.log('Summary response:', data);

                if (data && data.success) {
                    if (data.status === 'no_entry') {
                        document.getElementById('balanceValue').textContent = '₹ 0.00';
                        document.getElementById('openingVal').textContent = '₹ 0';
                        document.getElementById('closingVal').textContent = '₹ 0';
                        document.getElementById('creditsVal').textContent = '₹ 0';
                        document.getElementById('debitsVal').textContent = '₹ 0';
                        document.getElementById('statusDiv').innerHTML = '<div class="alert info"><span>ℹ️</span><span>No entry for today</span></div>';
                    } else {
                        const opening = parseFloat(data.openingBalance) || 0;
                        const closing = parseFloat(data.calculatedClosing) || 0;
                        const credits = parseFloat(data.totalCredit) || 0;
                        const debits = parseFloat(data.totalDebit) || 0;

                        document.getElementById('balanceValue').textContent = formatCurrency(closing);
                        document.getElementById('openingVal').textContent = formatCurrency(opening);
                        document.getElementById('closingVal').textContent = formatCurrency(closing);
                        document.getElementById('creditsVal').textContent = formatCurrency(credits);
                        document.getElementById('debitsVal').textContent = formatCurrency(debits);

                        const calculated = opening + credits - debits;
                        const isMatched = Math.abs(calculated - closing) < 1;
                        const statusClass = isMatched ? 'success' : 'warning';
                        const statusText = isMatched ? '✅ Balanced' : '⚠️ Mismatch';
                        document.getElementById('statusDiv').innerHTML = `<div class="alert ${statusClass}"><span>${isMatched ? '✓' : '⚠'}</span><span>${statusText}</span></div>`;
                    }
                }
            } catch (error) {
                console.error('loadSummary error:', error);
            }
        }

        // ===== LOAD MONTHLY DATA =====
        async function loadMonthlyData() {
            try {
                const month = new Date().getMonth() + 1;
                const year = new Date().getFullYear();
                const url = `${API_ENDPOINT}?action=getMonthlyData&month=${month}&year=${year}`;
                
                console.log('Fetching monthly data from:', url);
                
                const response = await fetch(url);
                const data = await response.json();
                
                console.log('Monthly data response:', data);

                if (data && data.success && data.dailyData && data.dailyData.length > 0) {
                    const dailyData = data.dailyData;
                    const totalCredits = dailyData.reduce((sum, d) => sum + (parseFloat(d.credits) || 0), 0);
                    const totalDebits = dailyData.reduce((sum, d) => sum + (parseFloat(d.debits) || 0), 0);
                    const lastDay = dailyData[dailyData.length - 1];
                    const currentBalance = lastDay ? parseFloat(lastDay.closing) || 0 : 0;

                    document.getElementById('monthlyCredits').textContent = formatCurrency(totalCredits);
                    document.getElementById('monthlyDebits').textContent = formatCurrency(totalDebits);
                    document.getElementById('currentBalance').textContent = formatCurrency(currentBalance);
                    document.getElementById('daysUploaded').textContent = dailyData.length;

                    const dailyHTML = dailyData.slice(-7).reverse().map(day => {
                        const status = day.status === 'balanced' ? 'verified' : 'mismatch';
                        const statusIcon = day.status === 'balanced' ? '✅' : '⚠️';
                        
                        return `
                            <div style="background: var(--bg); border: 1px solid var(--border-light); border-radius: 10px; padding: 12px; margin: 10px 0;">
                                <div style="font-weight: 700; font-size: 13px;">${day.date}</div>
                                <div style="font-size: 11px; color: var(--text-muted); margin-top: 4px;">📥 ${formatCurrency(day.credits)} | 📤 ${formatCurrency(day.debits)}</div>
                                <div style="margin-top: 6px; display: flex; align-items: center; gap: 4px; font-size: 11px;"><span>${statusIcon}</span><span>${status === 'verified' ? 'Verified' : 'Mismatch'}</span></div>
                            </div>
                        `;
                    }).join('');

                    document.getElementById('dailyActivityList').innerHTML = dailyHTML || '<p style="text-align: center; color: var(--text-muted); padding: 20px;">No data yet</p>';
                } else {
                    document.getElementById('dailyActivityList').innerHTML = '<p style="text-align: center; color: var(--text-muted); padding: 20px;">No data yet</p>';
                }
            } catch (error) {
                console.error('loadMonthlyData error:', error);
            }
        }

        // ===== LOAD LEDGER =====
        async function loadLedger() {
            try {
                const month = new Date().getMonth() + 1;
                const year = new Date().getFullYear();
                const url = `${API_ENDPOINT}?action=getMonthlyData&month=${month}&year=${year}`;
                
                const response = await fetch(url);
                const data = await response.json();

                if (data && data.success && data.dailyData && data.dailyData.length > 0) {
                    const ledgerHTML = data.dailyData.reverse().map(day => {
                        const status = day.status === 'balanced' ? 'verified' : 'mismatch';
                        const statusText = day.status === 'balanced' ? '✅ Verified' : '⚠️ Mismatch';
                        
                        return `
                            <div class="day-entry">
                                <div class="day-info">
                                    <div class="day-date">${day.date}</div>
                                    <div class="day-summary">O: ${formatCurrency(day.opening)} | C: ${formatCurrency(day.credits)} | D: ${formatCurrency(day.debits)} | Closing: ${formatCurrency(day.closing)}</div>
                                    <div class="day-status ${status}">${statusText}</div>
                                </div>
                                <div class="day-actions">
                                    <button class="btn-action danger" onclick="deleteDay('${day.date}')">🗑️</button>
                                </div>
                            </div>
                        `;
                    }).join('');
                    
                    document.getElementById('ledgerList').innerHTML = ledgerHTML || '<p style="text-align: center; color: var(--text-muted); padding: 20px;">No entries</p>';
                } else {
                    document.getElementById('ledgerList').innerHTML = '<p style="text-align: center; color: var(--text-muted); padding: 20px;">No entries</p>';
                }
            } catch (error) {
                console.error('loadLedger error:', error);
            }
        }

        // ===== ADD TRANSACTION =====
        function openAddTransaction() {
            updateCategories();
            openModal('transactionModal');
        }

        function updateCategories() {
            const type = document.getElementById('txnType').value;
            const categorySelect = document.getElementById('txnCategory');
            
            if (type === 'credit') {
                categorySelect.innerHTML = `
                    <option value="">Select...</option>
                    <option value="Other">Other Credits</option>
                    <option value="COD">COD</option>
                    <option value="Speed Post">Speed Post</option>
                    <option value="IPPB">IPPB</option>
                    <option value="Savings">Savings</option>
                    <option value="PLI">PLI</option>
                    <option value="RPLI">RPLI</option>
                    <option value="Sukanya">Sukanya</option>
                `;
            } else {
                categorySelect.innerHTML = `
                    <option value="">Select...</option>
                    <option value="Cash Deposit">Cash Deposit</option>
                    <option value="Withdrawal">Withdrawal</option>
                    <option value="IPPB">IPPB</option>
                    <option value="Commission">Commission</option>
                    <option value="RSAO">RSAO</option>
                    <option value="Other">Other</option>
                `;
            }
        }

        async function submitTransaction(event) {
            event.preventDefault();

            const name = document.getElementById('txnName').value;
            const type = document.getElementById('txnType').value;
            const amount = parseFloat(document.getElementById('txnAmount').value) || 0;
            const category = document.getElementById('txnCategory').value;

            const credit = type === 'credit' ? amount : 0;
            const debit = type === 'debit' ? amount : 0;

            try {
                showNotification('💾 Saving...');
                
                const url = `${API_ENDPOINT}?action=addTransaction&date=${currentDate}&name=${encodeURIComponent(name)}&credit=${credit}&debit=${debit}&category=${encodeURIComponent(category)}&confidence=100`;
                
                console.log('Adding transaction:', url);
                
                const response = await fetch(url);
                const data = await response.json();

                console.log('Add transaction response:', data);

                if (data.success) {
                    closeModal('transactionModal');
                    document.querySelector('#transactionModal form').reset();
                    
                    showNotification('✅ Added!');
                    
                    // Reload data after a short delay
                    setTimeout(() => {
                        loadAllData();
                    }, 500);
                } else {
                    showNotification('❌ Error: ' + (data.error || 'Unknown'));
                }
            } catch (error) {
                console.error('submitTransaction error:', error);
                showNotification('❌ Error: ' + error.message);
            }
        }

        async function deleteDay(date) {
            if (!confirm(`Delete all entries for ${date}?`)) return;

            try {
                const url = `${API_ENDPOINT}?action=deleteDay&date=${date}`;
                const response = await fetch(url);
                const data = await response.json();

                if (data.success) {
                    showNotification('🗑️ Deleted');
                    setTimeout(() => {
                        loadAllData();
                    }, 500);
                } else {
                    showNotification('❌ Error: ' + (data.error || 'Delete failed'));
                }
            } catch (error) {
                console.error('deleteDay error:', error);
                showNotification('❌ Error: ' + error.message);
            }
        }

        // ===== UI FUNCTIONS =====
        function showPage(page) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            
            if (page === 'home') {
                document.getElementById('homePage').classList.add('active');
                loadSummary();
            } else if (page === 'dashboard') {
                document.getElementById('dashboardPage').classList.add('active');
                loadMonthlyData();
            } else if (page === 'ledger') {
                document.getElementById('ledgerPage').classList.add('active');
                loadLedger();
            }
            
            if (event && event.target && event.target.closest) {
                event.target.closest('.nav-item').classList.add('active');
            }
        }

        function openModal(modalId) {
            const modal = document.getElementById(modalId);
            if (modal) {
                modal.classList.add('active');
            }
        }

        function closeModal(modalId) {
            const modal = document.getElementById(modalId);
            if (modal) {
                modal.classList.remove('active');
            }
        }

        function showNotification(message) {
            const notif = document.createElement('div');
            notif.textContent = message;
            notif.style.cssText = `
                position: fixed;
                bottom: 90px;
                left: 50%;
                transform: translateX(-50%);
                background: var(--bg);
                padding: 12px 20px;
                border-radius: 8px;
                border: 1px solid var(--border);
                z-index: 2000;
                font-size: 12px;
                font-weight: 600;
                box-shadow: var(--shadow-md);
                white-space: nowrap;
            `;
            document.body.appendChild(notif);
            setTimeout(() => notif.remove(), 3000);
        }
    </script>
</body>
</html>
