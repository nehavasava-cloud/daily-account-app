<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0F172A">
    <meta name="description" content="Daily Account Assistant - Modern postal accounting">
    <title>Daily Account Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #84cc16;
            --primary-dark: #65a30d;
            --primary-light: #a3e635;
            --accent: #06b6d4;
            --accent-warm: #f59e0b;
            --success: #10b981;
            --danger: #ef4444;
            --dark-bg: #0f172a;
            --dark-card: #1e293b;
            --dark-border: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: var(--dark-bg);
            color: var(--text-primary);
            overflow: hidden;
        }

        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* HEADER */
        header {
            padding: 20px;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.95) 0%, rgba(30, 41, 59, 0.95) 100%);
            border-bottom: 1px solid var(--dark-border);
            backdrop-filter: blur(10px);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
        }

        .header-text h1 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .header-text p {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .header-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: rgba(132, 204, 22, 0.1);
            border: 1px solid var(--dark-border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.3s ease;
        }

        .header-icon:active {
            background: rgba(132, 204, 22, 0.2);
            transform: scale(0.95);
        }

        /* BALANCE CARD */
        .balance-card {
            background: linear-gradient(135deg, rgba(132, 204, 22, 0.1) 0%, rgba(6, 182, 212, 0.05) 100%);
            border: 1px solid var(--dark-border);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .balance-label {
            font-size: 13px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .balance-value {
            font-size: 36px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 16px;
            line-height: 1;
        }

        .balance-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .balance-item {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid var(--dark-border);
            border-radius: 14px;
            padding: 12px;
            display: flex;
            flex-direction: column;
        }

        .balance-item-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .balance-item-value {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .balance-item-value.credit {
            color: var(--primary);
        }

        .balance-item-value.debit {
            color: var(--danger);
        }

        /* STATUS BADGE */
        .status-section {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }

        .status-badge {
            flex: 1;
            padding: 10px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            text-align: center;
            border: 1px solid;
            transition: all 0.3s ease;
        }

        .status-badge.ok {
            background: rgba(16, 185, 129, 0.1);
            border-color: var(--success);
            color: var(--success);
        }

        .status-badge.mismatch {
            background: rgba(239, 68, 68, 0.1);
            border-color: var(--danger);
            color: var(--danger);
        }

        .status-badge.no-entry {
            background: rgba(245, 158, 11, 0.1);
            border-color: var(--accent-warm);
            color: var(--accent-warm);
        }

        /* MAIN CONTENT */
        main {
            flex: 1;
            overflow-y: auto;
            padding: 0 20px 100px 20px;
        }

        /* ACTION GRID */
        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .action-btn {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid var(--dark-border);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: var(--text-primary);
            font-weight: 600;
            font-size: 13px;
        }

        .action-btn:active {
            background: var(--dark-card);
            transform: scale(0.95);
        }

        .action-btn.primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border-color: var(--primary);
            color: #000;
        }

        .action-btn.primary:active {
            opacity: 0.9;
        }

        .action-icon {
            font-size: 24px;
        }

        /* TRANSACTIONS SECTION */
        .transactions-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            margin-top: 20px;
        }

        .transactions-header h2 {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .transactions-header a {
            font-size: 13px;
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .transaction-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .transaction-item {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid var(--dark-border);
            border-radius: 14px;
            padding: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideIn 0.3s ease-out;
        }

        .transaction-avatar {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--accent-warm) 0%, var(--accent) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .transaction-info {
            flex: 1;
        }

        .transaction-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 2px;
        }

        .transaction-time {
            font-size: 12px;
            color: var(--text-muted);
        }

        .transaction-amount {
            font-size: 15px;
            font-weight: 700;
            text-align: right;
        }

        .transaction-amount.credit {
            color: var(--primary);
        }

        .transaction-amount.debit {
            color: var(--danger);
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        .modal.active {
            display: flex;
            align-items: flex-end;
        }

        .modal-content {
            background: var(--dark-card);
            width: 100%;
            border-radius: 24px 24px 0 0;
            padding: 24px;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease-out;
            border: 1px solid var(--dark-border);
            border-bottom: none;
        }

        .modal-header {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-btn {
            width: 32px;
            height: 32px;
            border: none;
            background: rgba(132, 204, 22, 0.1);
            border: 1px solid var(--dark-border);
            border-radius: 8px;
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .close-btn:active {
            background: rgba(132, 204, 22, 0.2);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-input, .form-select {
            width: 100%;
            padding: 12px;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--dark-border);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(132, 204, 22, 0.1);
        }

        .form-input::placeholder {
            color: var(--text-muted);
        }

        /* SUBMIT BUTTON */
        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border: none;
            border-radius: 12px;
            color: #000;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .submit-btn:active {
            transform: scale(0.98);
            box-shadow: 0 4px 12px rgba(132, 204, 22, 0.3);
        }

        /* BOTTOM NAV */
        nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.8) 0%, rgba(15, 23, 42, 0.95) 100%);
            border-top: 1px solid var(--dark-border);
            padding: 8px 0;
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 11px;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
            background: none;
            font-weight: 600;
        }

        .nav-item.active {
            color: var(--primary);
        }

        .nav-icon {
            font-size: 20px;
            margin-bottom: 4px;
        }

        /* ANIMATIONS */
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                transform: translateY(100%);
            }
            to {
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* SCROLLBAR */
        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--dark-border);
            border-radius: 2px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        /* RESPONSIVE */
        @media (max-width: 600px) {
            header {
                padding: 16px;
            }

            main {
                padding: 16px 16px 100px 16px;
            }

            .balance-value {
                font-size: 32px;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- HEADER -->
        <header>
            <div class="header-content">
                <div class="header-left">
                    <div class="user-avatar">📮</div>
                    <div class="header-text">
                        <h1 id="userName">Welcome Back</h1>
                        <p id="headerDate">Today</p>
                    </div>
                </div>
                <div class="header-icon" onclick="toggleSettings()">⚙️</div>
            </div>

            <!-- BALANCE CARD -->
            <div class="balance-card">
                <div class="balance-label">Today's Balance</div>
                <div class="balance-value" id="balanceValue">₹ 0.00</div>
                <div class="balance-row">
                    <div class="balance-item">
                        <div class="balance-item-label">Opening</div>
                        <div class="balance-item-value" id="openingVal">₹ 0</div>
                    </div>
                    <div class="balance-item">
                        <div class="balance-item-label">Closing</div>
                        <div class="balance-item-value" id="closingVal">₹ 0</div>
                    </div>
                </div>
                <div class="balance-row" style="margin-top: 12px;">
                    <div class="balance-item">
                        <div class="balance-item-label">Credits</div>
                        <div class="balance-item-value credit" id="creditsVal">₹ 0</div>
                    </div>
                    <div class="balance-item">
                        <div class="balance-item-label">Debits</div>
                        <div class="balance-item-value debit" id="debitsVal">₹ 0</div>
                    </div>
                </div>
                <div class="status-section" id="statusSection"></div>
            </div>
        </header>

        <!-- MAIN CONTENT -->
        <main id="mainContent">
            <!-- ACTION BUTTONS -->
            <div class="action-grid">
                <button class="action-btn primary" onclick="openAddTransaction()">
                    <div class="action-icon">➕</div>
                    <div>Add Entry</div>
                </button>
                <button class="action-btn" onclick="openUploadModal()">
                    <div class="action-icon">📤</div>
                    <div>Upload PDF</div>
                </button>
            </div>

            <!-- TRANSACTIONS -->
            <div class="transactions-header">
                <h2>Today's Activity</h2>
                <a href="#" onclick="event.preventDefault(); showTab('ledger')">View all →</a>
            </div>
            <div class="transaction-list" id="transactionList"></div>
        </main>

        <!-- BOTTOM NAV -->
        <nav>
            <button class="nav-item active" onclick="showTab('home')">
                <div class="nav-icon">🏠</div>
                <div>Home</div>
            </button>
            <button class="nav-item" onclick="showTab('ledger')">
                <div class="nav-icon">📊</div>
                <div>Ledger</div>
            </button>
            <button class="nav-item" onclick="showTab('alerts')">
                <div class="nav-icon">⚠️</div>
                <div>Alerts</div>
            </button>
            <button class="nav-item" onclick="showTab('more')">
                <div class="nav-icon">⋯</div>
                <div>More</div>
            </button>
        </nav>
    </div>

    <!-- MODALS -->
    <!-- ADD TRANSACTION MODAL -->
    <div class="modal" id="transactionModal">
        <div class="modal-content">
            <div class="modal-header">
                <span>Add Transaction</span>
                <button class="close-btn" onclick="closeModal('transactionModal')">✕</button>
            </div>
            <form onsubmit="submitTransaction(event)">
                <div class="form-group">
                    <label class="form-label">Description</label>
                    <input type="text" id="txnName" class="form-input" placeholder="e.g., COD Payment" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Type</label>
                    <select id="txnType" class="form-select" onchange="updateTxnType()">
                        <option value="credit">📥 Credit (Incoming)</option>
                        <option value="debit">📤 Debit (Outgoing)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Amount</label>
                    <input type="number" id="txnAmount" class="form-input" placeholder="₹ 0" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Category</label>
                    <select id="txnCategory" class="form-select">
                        <option value="Other Credits">Other Credits</option>
                        <option value="COD">Value Payable / COD</option>
                        <option value="Deposit">Saving Bank Deposit</option>
                        <option value="Insurance">Insurance</option>
                    </select>
                </div>
                <button type="submit" class="submit-btn">Add Transaction</button>
            </form>
        </div>
    </div>

    <!-- UPLOAD PDF MODAL -->
    <div class="modal" id="uploadModal">
        <div class="modal-content">
            <div class="modal-header">
                <span>Upload Daily PDF</span>
                <button class="close-btn" onclick="closeModal('uploadModal')">✕</button>
            </div>
            <div class="form-group">
                <label class="form-label">Select PDF</label>
                <input type="file" id="pdfFile" class="form-input" accept=".pdf">
            </div>
            <div class="form-group">
                <label class="form-label">Date</label>
                <input type="date" id="uploadDate" class="form-input">
            </div>
            <button class="submit-btn" onclick="processPDF()">Process PDF</button>
        </div>
    </div>

    <script>
        const API_ENDPOINT = 'https://script.google.com/macros/s/AKfycbwPo7Qt_JGKAijXBNyIjKYHEvYCCSNOtiIKjDvp13e0H6P781iNBxm5IK66mLa0ju0Z/exec';

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            setHeaderDate();
            loadSummary();
            loadTransactions();
        });

        function setHeaderDate() {
            const now = new Date();
            const options = { weekday: 'short', month: 'short', day: 'numeric' };
            const dateStr = now.toLocaleDateString('en-US', options);
            document.getElementById('headerDate').textContent = dateStr;
            document.getElementById('uploadDate').valueAsDate = now;
        }

        function formatCurrency(amount) {
            return '₹ ' + parseFloat(amount).toLocaleString('en-IN', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }

        async function loadSummary() {
            try {
                const response = await fetch(`${API_ENDPOINT}?action=getSummary`);
                const data = await response.json();

                if (data.success) {
                    if (data.status === 'no_entry') {
                        document.getElementById('balanceValue').textContent = '₹ 0.00';
                        document.getElementById('openingVal').textContent = '₹ 0';
                        document.getElementById('closingVal').textContent = '₹ 0';
                        document.getElementById('creditsVal').textContent = '₹ 0';
                        document.getElementById('debitsVal').textContent = '₹ 0';
                        document.getElementById('statusSection').innerHTML = 
                            '<div class="status-badge no-entry">📝 No entry for today</div>';
                    } else {
                        const opening = data.openingBalance || 0;
                        const closing = data.calculatedClosing || 0;
                        const credits = data.totalCredit || 0;
                        const debits = data.totalDebit || 0;

                        document.getElementById('balanceValue').textContent = formatCurrency(closing);
                        document.getElementById('openingVal').textContent = formatCurrency(opening);
                        document.getElementById('closingVal').textContent = formatCurrency(closing);
                        document.getElementById('creditsVal').textContent = formatCurrency(credits);
                        document.getElementById('debitsVal').textContent = formatCurrency(debits);

                        const isMatched = Math.abs(closing - (data.pdfClosing || closing)) < 1;
                        const statusClass = isMatched ? 'ok' : 'mismatch';
                        const statusText = isMatched ? '✓ Balanced' : '⚠ Mismatch';
                        document.getElementById('statusSection').innerHTML = 
                            `<div class="status-badge ${statusClass}">${statusText}</div>`;
                    }
                }
            } catch (error) {
                console.error('Error loading summary:', error);
            }
        }

        async function loadTransactions() {
            try {
                const today = new Date().toISOString().split('T')[0];
                const response = await fetch(`${API_ENDPOINT}?action=getTransactions&date=${today}`);
                const data = await response.json();

                const listHTML = data.transactions && data.transactions.length > 0
                    ? data.transactions.map((txn, idx) => `
                        <div class="transaction-item">
                            <div class="transaction-avatar">${txn.credit > 0 ? '📥' : '📤'}</div>
                            <div class="transaction-info">
                                <div class="transaction-name">${txn.name}</div>
                                <div class="transaction-time">${txn.category}</div>
                            </div>
                            <div class="transaction-amount ${txn.credit > 0 ? 'credit' : 'debit'}">
                                ${txn.credit > 0 ? '+' : '-'}${formatCurrency(Math.max(txn.credit, txn.debit)).substring(2)}
                            </div>
                        </div>
                    `).join('')
                    : '<div style="text-align: center; color: var(--text-muted); padding: 40px 20px; grid-column: 1/-1;">No transactions yet</div>';

                document.getElementById('transactionList').innerHTML = listHTML || '<div style="text-align: center; color: var(--text-muted); padding: 40px 20px;">No transactions yet</div>';
            } catch (error) {
                console.error('Error loading transactions:', error);
            }
        }

        function openAddTransaction() {
            document.getElementById('transactionModal').classList.add('active');
        }

        function openUploadModal() {
            document.getElementById('uploadModal').classList.add('active');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        function updateTxnType() {
            const type = document.getElementById('txnType').value;
            const categorySelect = document.getElementById('txnCategory');
            if (type === 'credit') {
                categorySelect.innerHTML = `
                    <option value="Other Credits">Other Credits</option>
                    <option value="COD">Value Payable / COD</option>
                    <option value="Deposit">Saving Bank Deposit</option>
                    <option value="Insurance">Insurance</option>
                `;
            } else {
                categorySelect.innerHTML = `
                    <option value="Cash Deposit">Cash Deposit</option>
                    <option value="Withdrawal">Bank Withdrawal</option>
                    <option value="Commission">Commission / Other</option>
                `;
            }
        }

        async function submitTransaction(event) {
            event.preventDefault();

            const name = document.getElementById('txnName').value;
            const type = document.getElementById('txnType').value;
            const amount = parseFloat(document.getElementById('txnAmount').value);
            const category = document.getElementById('txnCategory').value;
            const date = new Date().toISOString().split('T')[0];

            const credit = type === 'credit' ? amount : 0;
            const debit = type === 'debit' ? amount : 0;

            try {
                const response = await fetch(`${API_ENDPOINT}?action=addTransaction&date=${date}&name=${encodeURIComponent(name)}&credit=${credit}&debit=${debit}&category=${encodeURIComponent(category)}&confidence=100`);
                const data = await response.json();

                if (data.success) {
                    closeModal('transactionModal');
                    document.getElementById('transactionModal').querySelector('form').reset();
                    loadSummary();
                    loadTransactions();
                    showNotification('✅ Transaction added!');
                }
            } catch (error) {
                console.error('Error:', error);
                showNotification('❌ Error adding transaction');
            }
        }

        function processPDF() {
            showNotification('📄 PDF processing coming soon...');
        }

        function showTab(tab) {
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            event.target.closest('.nav-item').classList.add('active');

            if (tab === 'home') {
                loadSummary();
                loadTransactions();
            }
        }

        function toggleSettings() {
            showNotification('⚙️ Settings coming soon...');
        }

        function showNotification(message) {
            const notification = document.createElement('div');
            notification.textContent = message;
            notification.style.cssText = `
                position: fixed;
                bottom: 110px;
                left: 50%;
                transform: translateX(-50%);
                background: var(--dark-card);
                color: var(--text-primary);
                padding: 12px 20px;
                border-radius: 12px;
                border: 1px solid var(--dark-border);
                z-index: 2000;
                font-weight: 600;
                font-size: 13px;
                animation: slideUp 0.3s ease-out;
            `;
            document.body.appendChild(notification);
            setTimeout(() => notification.remove(), 3000);
        }
    </script>
